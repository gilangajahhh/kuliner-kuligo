services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-10000}:10000"
    environment:
      APP_NAME: "${APP_NAME:-Kuligo Resto}"
      APP_ENV: "${APP_ENV:-local}"
      APP_DEBUG: "${APP_DEBUG:-true}"
      APP_KEY: "${APP_KEY:-}"
      APP_URL: "${APP_URL:-http://localhost:10000}"
      LOG_CHANNEL: "${LOG_CHANNEL:-stack}"
      # Isi variabel DB_* di Coolify dari kredensial koneksi Supabase.
      DB_CONNECTION: pgsql
      DB_HOST: "${DB_HOST:?Isi DB_HOST dengan hostname Supabase di Coolify}"
      DB_PORT: "${DB_PORT:?Isi DB_PORT sesuai koneksi Supabase di Coolify}"
      DB_DATABASE: "${DB_DATABASE:?Isi DB_DATABASE di Coolify}"
      DB_USERNAME: "${DB_USERNAME:?Isi DB_USERNAME di Coolify}"
      DB_PASSWORD: "${DB_PASSWORD:?Isi DB_PASSWORD di Coolify}"
      DB_SSLMODE: "${DB_SSLMODE:-require}"
      SESSION_DRIVER: "${SESSION_DRIVER:-file}"
      CACHE_STORE: "${CACHE_STORE:-file}"
      QUEUE_CONNECTION: "${QUEUE_CONNECTION:-sync}"
      MIDTRANS_SERVER_KEY: "${MIDTRANS_SERVER_KEY:-}"
      MIDTRANS_CLIENT_KEY: "${MIDTRANS_CLIENT_KEY:-}"
      MIDTRANS_IS_PRODUCTION: "${MIDTRANS_IS_PRODUCTION:-false}"
    restart: unless-stopped
